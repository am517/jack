name = "daniel"
role = "database"
summary = "Daniel takes one entry per file from any windup, adds Larry's hash and Ruth's reference, stores everything in media.db (or JSON beside the file if there's no database), then alerts Walter when enough has changed (thresholds in daniel.toml), never for work Walter started."
purpose = "Keep everything the windups learn, safely and whole, in one shared database."
status = "library (real store code); called by Jack through windups::handoff::Daniel"
reads = ["handoffs"]
writes = ["media.db (media, candidates, texts, art, ids, ratings, names, conflicts, unresolved, decisions, lifecycle, files and hashes, works and their ids, proposals, last_checked)", "JSON beside the file when no database"]
calls = ["larry", "ruth", "walter (optional)"]
never = ["guess", "overwrite a source's data", "merge entries on a fingerprint hint"]

[[success_checks]]
check = "every handoff is stored, or saved as JSON beside the file when there is no database"
test = "daniel/src/store.rs::save_uses_db_else_json_beside_media"

[[success_checks]]
check = "re-storing the same file updates its entry; ids never change or get reused"
test = "daniel/src/store.rs::records_chosen_candidates_texts_art_genres_ids_and_rerun_updates"

[[success_checks]]
check = "nothing is merged automatically; fingerprint hints only open proposals"
test = "windups/src/proposals.rs::once_per_pair_and_stays_open"

[[success_checks]]
check = "Walter is alerted when a threshold is reached and never for work Walter started"
test = "daniel/src/lib.rs::alerts_walter_at_the_threshold_but_never_for_walters_own_work"
