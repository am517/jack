[package]
name = "larry"
version = "0.1.0"
edition = "2024"
description = "Larry, the hashing windup: exact, partial and look-alike fingerprints of media files"
license = "MIT"

[dependencies]
blake3 = "1.8.7"
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
windups.workspace = true

[dev-dependencies]
tempfile = "3"
