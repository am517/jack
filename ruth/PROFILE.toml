name = "ruth"
role = "references"
summary = "Ruth builds the APA 7 work reference and work key from gathered facts, using original-language titles and the original release; provisional whenever it can't be fully built."
purpose = "Name each work in one standard way, so versions of the same work group together."
status = "library (real code, called by Daniel); no CLI yet"
reads = ["an entry's facts"]
writes = ["work reference, key, provisional flag, what is missing"]

[[success_checks]]
check = "the reference follows APA 7 and uses original-language titles and the original release"
test = "ruth/src/lib.rs::original_names_episode_titles_and_provisional"

[[success_checks]]
check = "a reference missing anything it needs is marked provisional and lists what is missing"
test = "ruth/src/lib.rs::original_names_episode_titles_and_provisional"

[[success_checks]]
check = "the same facts always give the same work key"
test = "ruth/src/lib.rs::original_names_episode_titles_and_provisional"
