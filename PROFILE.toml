# Walter's profile. Name proposed; pending Adam's OK.
name = "walter"
role = "patrol"
summary = "Walter patrols the shared database for unfinished work. Every entry that isn't complete has a scheduled return; Walter decides from its stage, reason, last check and returns when to call the right windup again, and wakes waiting entries when a new windup or source appears."
status = "stub"
reads = ["media.db (media lifecycle, last_checked, status_history, returns, windups, capabilities)"]
writes = ["media.db (returns, capabilities)"]
calls = ["jack (and other windups) with the files that are due"]
never = ["decide what a file is", "run on a system timer: windups call windups"]
command = "walter [pending | patrol [--all] [--wake CAPABILITY]] [--db PATH] [--config PATH]"
