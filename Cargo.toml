[package]
name = "jack"
version = "0.1.7"
edition = "2024"
description = "Tag and sort movie and TV files"
license = "MIT"
repository = "https://github.com/am517/jack"
homepage = "https://github.com/am517/jack"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
rpassword = "7"
walkdir = "2"
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
ureq = { version = "2", features = ["json"] }
unicode-normalization = "0.1.26"
windups = { path = "../windups" }
rusqlite = "0.32"

[dev-dependencies]
tempfile = "3"
