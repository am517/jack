[package]
name = "windups"
version = "0.1.0"
edition = "2024"
description = "Shared library for all windups: settings, media.db, raw archive"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
