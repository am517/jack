# Jack configuration. All tweakable behavior lives here, not in code.
# Copy to ~/.config/swarm/jack/config.toml (or pass --config <path>).
# This file is also compiled in as the fallback defaults.
# Per-file sidecar: "<filename>.config" beside the media file, same keys.
# Precedence: CLI flags > sidecar > main config > these defaults.

# Media file extensions to scan for (case-insensitive, no dot).
extensions = ["mp4", "m4v", "mkv", "mov", "avi"]

# Recurse into subdirectories when given a directory.
recursive = true

# Suffix appended to a media filename to find its sidecar.
sidecar_suffix = ".config"

# Destination root for sorted files (phase 4).
# output = "~/Movies/Sorted"

# Show what would change instead of changing anything.
dry_run = false
download_only = false

# Where --download-only saves fetched metadata ("<filename><meta_suffix>").
# --from-file <path> reads it back; give a directory to use "<dir>/<filename><meta_suffix>".
meta_suffix = ".meta.json"

[tagger]
# MP4/M4V/MOV writer: "atomicparsley" (iTunes-style atoms, like iVI4) or "exiftool".
mp4_tool = "atomicparsley"
# Tool paths (name on PATH or absolute path; ~ is expanded).
atomicparsley = "AtomicParsley"
exiftool = "exiftool"
mkvpropedit = "mkvpropedit"
mp4_extensions = ["mp4", "m4v", "mov"]
mkv_extensions = ["mkv"]
# Embed downloaded poster art when tagging.
embed_artwork = true
# AtomicParsley's short description is limited; longer text goes in the long description.
short_description_max = 250

# Saved poster art: "<filename><poster_suffix>" (used by --download-only and embedding).
poster_suffix = ".poster.jpg"

[providers]
# Providers to query, in order. (IMDb ids given with --imdb are resolved through TMDB.)
order = ["tmdb", "thetvdb"]

[providers.tmdb]
# Get one at https://www.themoviedb.org/settings/api. Set read_token (preferred) or api_key.
read_token = ""
api_key = ""
base_url = "https://api.themoviedb.org/3"
image_base = "https://image.tmdb.org/t/p/original"
language = "en-US"

[providers.thetvdb]
# Get one at https://thetvdb.com/api-information. pin only if your key is a user-supported key.
api_key = ""
pin = ""
base_url = "https://api4.thetvdb.com/v4"

[merge]
# Composite metadata: for each field, take the first provider in its list that has a value.
default = ["tmdb", "thetvdb"]
[merge.fields]
episode_title = ["thetvdb", "tmdb"]
description = ["tmdb", "thetvdb"]
poster_url = ["tmdb", "thetvdb"]

[matching]
# Filename -> title. Applied to the file stem in order: separators become spaces,
# then TV patterns (named groups show/season/episode), then movie patterns (title/year).
separators = '[._]+'
tv_patterns = [
  '(?i)^(?P<show>.*?)[ \-]*S(?P<season>\d{1,2})[ \-]*E(?P<episode>\d{1,3})',
  '(?i)^(?P<show>.*?)[ \-]*(?P<season>\d{1,2})x(?P<episode>\d{2,3})\b',
]
movie_patterns = [
  '^(?P<title>.+)[ \-]*[(\[](?P<year>(?:19|20)\d{2})[)\]]',
  '^(?P<title>.+?)[ \-]*[(\[]?(?P<year>(?:19|20)\d{2})[)\]]?(?:\s|$)',
]
# Removed from titles (case-insensitive), e.g. release junk.
cleanup = [
  '(?i)\b(2160p|1080p|720p|480p|4k|uhd|hdr|bluray|blu-ray|brrip|web-?dl|webrip|hdtv|dvdrip|x264|x265|h\.?264|h\.?265|hevc|aac|ac3|dts|remux|proper|repack)\b.*$',
  '\[[^\]]*\]',
]
# If a TV filename has no show name, use the parent folder name.
show_from_parent_dir = true

[sort]
# Used only when an output root is set (--output or `output` above). Paths are relative to it.
# Placeholders: {title} {year} {show} {season} {episode} {episode_title} {ext}; {season:02} zero-pads.
movie_template = "Movies/{title} ({year})/{title} ({year}).{ext}"
tv_template = "TV/{show}/Season {season:02}/{show} - S{season:02}E{episode:02} - {episode_title}.{ext}"
# "move" or "copy".
mode = "move"
# Characters not allowed in file names, and what replaces them.
illegal_chars = '/\:*?"<>|'
replacement = "-"
