# Jack settings. Copy to ~/.config/windups/jack/config.toml (or use --config <path>).
# Per-file values (name, year, ids, grouping) are flags. Jack never reads sidecar files.
# Priority: command-line flags > this file.


# ── Files ─────────────────────────────────────────────────────────

# File types to look for.
extensions = ["mp4", "m4v", "mkv", "mov", "avi"]

# Look inside subfolders.
recursive = true

# Where saved metadata goes with --download-only: "<filename><meta_suffix>".
meta_suffix = ".meta.json"

# Sort files into this folder (see [sort]).
# output = "~/Media"


# ── Run ───────────────────────────────────────────────────────────

# "auto", "tv" or "movie".
type = "auto"

# Show what would happen without changing anything.
dry_run = false

# Only save metadata and art next to the file; don't touch the file.
download_only = false

# Print the metadata instead of tagging.
print = false

# Print as "text" or "json".
print_format = "text"


[tagger]

# MP4 tag writer: "atomicparsley" or "exiftool".
mp4_tool = "atomicparsley"

# Tool names or paths.
atomicparsley = "AtomicParsley"
exiftool = "exiftool"
mkvpropedit = "mkvpropedit"
mkvextract = "mkvextract"
mkvmerge = "mkvmerge"

# Which files each tool handles.
mp4_extensions = ["mp4", "m4v", "mov"]
mkv_extensions = ["mkv"]

# Longer descriptions also go in the long description.
short_description_max = 250

# ── Artwork ──

# Download and embed art (replaces existing art).
embed_artwork = true

# Art saved with --download-only: "<filename><poster_suffix>" (otherwise a temp file).
poster_suffix = ".poster.jpg"

# "poster" or "landscape".
art_style = "poster"

# What to try if a style has no art.
art_fallback = { poster = ["poster", "landscape"], landscape = ["landscape", "poster"] }

# TV posters, in order: "season", "series".
tv_poster = ["season", "series"]

# TV landscape art, in order: "still" (episode), "backdrop" (show).
tv_landscape = ["still", "backdrop"]

# Cover name inside MKV files.
mkv_cover_name = "cover.jpg"

# ── Choose art (--ask-art) ──

# Download all available art, list it and ask which to use.
ask_art = false

# Most images to show.
ask_art_max = 20

# Open the image folder while asking (default: on for macOS only).
# ask_art_open_folder = true
ask_art_open_command = "open"

# Keep the image folder afterwards.
ask_art_keep = false

# ── Extra tags ──

# Write the content rating (e.g. PG-13) on MP4 files.
mp4_content_rating = true

# Namespace for the MP4 custom tags below.
id_domain = "com.apple.iTunes"

# Custom tags: metadata key = tag name. Database ids are read back on later runs.
[tagger.mp4_id_tags]
imdb_id = "IMDB_ID"
tmdb_id = "TMDB_ID"
thetvdb_id = "TVDB_ID"
tmdb_series_id = "TMDB_SERIES_ID"
tmdb_episode_id = "TMDB_EPISODE_ID"
thetvdb_series_id = "TVDB_SERIES_ID"
thetvdb_episode_id = "TVDB_EPISODE_ID"
rating_imdb = "IMDB_RATING"
rating_rotten_tomatoes = "ROTTEN_TOMATOES"
rating_metacritic = "METACRITIC"
rated = "RATED"
awards = "AWARDS"
original_title = "ORIGINAL_TITLE"
original_show = "ORIGINAL_SHOW"
original_episode_title = "ORIGINAL_EPISODE_TITLE"

[tagger.mkv_id_tags]
imdb_id = "IMDB"
tmdb_id = "TMDB"
thetvdb_id = "TVDB"
tmdb_series_id = "TMDB_SERIES"
tmdb_episode_id = "TMDB_EPISODE"
thetvdb_series_id = "TVDB_SERIES"
thetvdb_episode_id = "TVDB_EPISODE"
rating_imdb = "IMDB_RATING"
rating_rotten_tomatoes = "ROTTEN_TOMATOES_RATING"
rating_metacritic = "METACRITIC_RATING"
rated = "LAW_RATING"
awards = "AWARDS"
original_title = "ORIGINAL_TITLE"
original_show = "ORIGINAL_SHOW"
original_episode_title = "ORIGINAL_EPISODE_TITLE"


[providers]

# Databases to use, in order. OMDb adds ratings and is skipped without a key.
# wikidata, tvmaze, itunes and youtube run after the others and reuse the ids they found.
order = ["tmdb", "thetvdb", "omdb", "wikidata", "tvmaze", "itunes", "youtube"]

# Main language (2 letters).
language = "en"

# Also keep names in the original language.
keep_original = true

# Add " (year)" to TV show names.
tv_show_year = false

# Add "Original title: ..." to the description.
original_in_description = false

# Genres: "lower", "title" or "asis" case, joined with genre_separator.
genre_case = "lower"
genre_separator = ","

# Genres are compared lowercase with '-'/'_' as spaces ("Science-Fiction" = "science fiction").
# Aliases map such a normalized name to the one to keep.
genre_aliases = { "sci fi" = "science fiction", "scifi" = "science fiction" }

# 2-letter to 3-letter language codes (for TheTVDB).
language_codes = { en = "eng", ja = "jpn", fr = "fra", de = "deu", es = "spa", it = "ita", pt = "por", ko = "kor", zh = "zho", ru = "rus", nl = "nld", sv = "swe" }

[providers.tmdb]

# Key from https://www.themoviedb.org/settings/api (read_token or api_key).
read_token = ""
api_key = ""

# When both are empty, read them from these environment variables. Empty = off.
read_token_env = "TMDB_ACCESS_TOKEN"
api_key_env = "TMDB_API_KEY"

language = "en-US"

# Preferred language for backdrops.
image_language = "en"

# Sizes: w92 … w780 or "original" (backdrops w300 w780 w1280; stills w92 w185 w300).
poster_size = "original"
backdrop_size = "original"
still_size = "original"

base_url = "https://api.themoviedb.org/3"
image_base = "https://image.tmdb.org/t/p"

[providers.thetvdb]

# Key from https://thetvdb.com/api-information (pin only if your key needs one).
api_key = ""

# When api_key is empty, read the key from this environment variable. Empty = off.
api_key_env = "THETVDB_API_KEY"
pin = ""

# 3-letter language; empty uses [providers] language.
language = ""

# Preferred language for background art.
image_language = "eng"

# "full" or "thumbnail".
poster_size = "full"

base_url = "https://api4.thetvdb.com/v4"

[providers.omdb]

# Key from https://www.omdbapi.com/apikey.aspx.
api_key = ""

# When api_key is empty, read the key from this environment variable. Empty = off.
api_key_env = "OMDB_API_KEY"

# "short" or "full".
plot = "short"

base_url = "https://www.omdbapi.com/"

[providers.wikidata]

# Cross-ids, franchise and series groupings. Looked up only by a known id.
base_url = "https://www.wikidata.org/w/api.php"
language = "en"

[providers.wikipedia]

# Article summary, used only when no provider gave a description.
enabled = true
base_url = "https://en.wikipedia.org/api/rest_v1"

[providers.tvmaze]

# Free TV data, no key.
base_url = "https://api.tvmaze.com"

[providers.itunes]

# iTunes Search API, no key: high-resolution art.
base_url = "https://itunes.apple.com/search"
country = "US"
art_size = "3000x3000bb"
limit = 5

[providers.youtube]

# Trailer link. Key from https://console.cloud.google.com (YouTube Data API v3). Empty = skipped.
api_key = ""
base_url = "https://www.googleapis.com/youtube/v3"
search_suffix = "trailer"
watch_url = "https://www.youtube.com/watch?v="


[merge]

# For each field, use the first database in its list that has a value.
default = ["tmdb", "thetvdb", "omdb"]

# Fields where the longest value wins instead (ties: the list order).
longest = ["description"]

[merge.fields]
episode_title = ["thetvdb", "tmdb"]
description = ["tmdb", "thetvdb", "omdb"]
poster_url = ["tmdb", "thetvdb", "omdb"]
season_poster_url = ["tmdb", "thetvdb"]
backdrop_url = ["tmdb", "thetvdb"]
still_url = ["tmdb", "thetvdb"]
rating_imdb = ["omdb"]
rating_rotten_tomatoes = ["omdb"]
rating_metacritic = ["omdb"]
rated = ["omdb"]
awards = ["omdb"]


[matching]

# How titles are read from file names (regular expressions).
separators = '[._]+'

tv_patterns = [
  '(?i)^(?P<show>.*?)[ \-]*S(?P<season>\d{1,2})[ \-]*E(?P<episode>\d{1,3})',
  '(?i)^(?P<show>.*?)[ \-]*(?P<season>\d{1,2})x(?P<episode>\d{2,3})\b',
]

movie_patterns = [
  '^(?P<title>.+)[ \-]*[(\[](?P<year>(?:19|20)\d{2})[)\]]',
  '^(?P<title>.+?)[ \-]*[(\[]?(?P<year>(?:19|20)\d{2})[)\]]?(?:\s|$)',
]

# Removed from titles (release tags etc.).
cleanup = [
  '(?i)\b(2160p|1080p|720p|480p|4k|uhd|hdr|bluray|blu-ray|brrip|web-?dl|webrip|hdtv|dvdrip|x264|x265|h\.?264|h\.?265|hevc|aac|ac3|dts|remux|proper|repack)\b.*$',
  '\[[^\]]*\]',
]

# No show name in a TV file name: use the folder name.
show_from_parent_dir = true

# No episode title found: use the text after SxxExx in the file name.
episode_title_from_filename = true


[naming]

# Language for file and folder names: "original" or a 2-letter code.
file_language = "original"
folder_language = "en"

# Longest file or folder name (extension kept; 0 = no limit).
filename_max = 255

# Unit for filename_max: "chars", "bytes", or "auto" (chars on macOS, bytes on Linux).
filename_unit = "auto"


[sort]

# Files are moved ONLY with -o / output, or when this is true.
enabled = false

# "move" or "copy".
mode = "move"

# Top folders (-o replaces both).
tv_root = "~/TV"
movie_root = "~/Movies"

# Names. Use any metadata key in {}: {title} {year} {show} {season} {episode} {episode_title} {ext} …
# _en = main language, _file / _folder = [naming] languages. {season:02} pads to 2 digits.
movie_template = "{movie_root}/{title_en}/{title_file} ({year}).{ext}"
tv_template = "{tv_root}/{show_en} ({show_year})/Season {season}/{show_file} S{season:02}E{episode:02} - {episode_title_file}.{ext}"

# Characters not allowed in names, and their replacement.
illegal_chars = '/\:*?"<>|'
replacement = "-"


[store]

# Save everything Jack fetches (chosen result, all candidates, texts, art, genres, ids) into media.db.
enabled = true

# media.db path; empty = the shared windups setting (~/.config/windups/windups.toml, database).
database = ""

# If media.db can't be opened, a JSON file is written beside the media instead: "<filename><fallback_suffix>".
fallback_suffix = ".jack.json"

# Seconds to wait for a busy database before giving up.
busy_timeout_secs = 5
