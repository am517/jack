# Jack configuration. All tweakable behavior lives here, not in code.
# Copy to ~/.config/windups/jack/config.toml (or pass --config <path>).
# This file is also compiled in as the fallback defaults.
# Per-file sidecar: "<filename>.config" beside the media file, same keys.
# Precedence: CLI flags > sidecar > main config > these defaults.

# Media file extensions to scan for (case-insensitive, no dot).
extensions = ["mp4", "m4v", "mkv", "mov", "avi"]

# Recurse into subdirectories when given a directory.
recursive = true

# Suffix appended to a media filename to find its sidecar.
sidecar_suffix = ".config"

# Destination root for sorted files (phase 4).
# output = "~/Movies/Sorted"

# Show what would change instead of changing anything.
dry_run = false
download_only = false

# Where --download-only saves fetched metadata ("<filename><meta_suffix>").
# --from-file <path> reads it back; give a directory to use "<dir>/<filename><meta_suffix>".
meta_suffix = ".meta.json"

# Search overrides (usually set per file in a sidecar, or with --name / --year).
# name replaces the title guessed from the filename; year filters searches.
# name = "Blade Runner"
# year = "1982"

[tagger]
# MP4/M4V/MOV writer: "atomicparsley" (iTunes-style atoms, like iVI4) or "exiftool".
mp4_tool = "atomicparsley"
# Tool paths (name on PATH or absolute path; ~ is expanded).
atomicparsley = "AtomicParsley"
exiftool = "exiftool"
mkvpropedit = "mkvpropedit"
# Used to read MKV tags back (ids from earlier runs).
mkvextract = "mkvextract"
mp4_extensions = ["mp4", "m4v", "mov"]
mkv_extensions = ["mkv"]
# Artwork (like iVI4): on every normal run the poster is downloaded and embedded
# (MP4 covr atom, replacing any existing art; MKV attachment, replacing an existing one).
embed_artwork = true
# TV episodes: poster choice in order, falling back to the next ("season", "series").
tv_poster = ["season", "series"]
# Art orientation: "poster" or "landscape" (sidecar key art_style, flag --art).
# Landscape: movies use a backdrop; TV episodes use tv_landscape in order.
art_style = "poster"
tv_landscape = ["still", "backdrop"]
# Style order to try per chosen style (falls back when the first has no art).
art_fallback = { poster = ["poster", "landscape"], landscape = ["landscape", "poster"] }
# MKV cover attachment name (Matroska convention: cover.jpg).
mkv_cover_name = "cover.jpg"
# Used to list existing MKV attachments.
mkvmerge = "mkvmerge"
# AtomicParsley's short description is limited; longer text goes in the long description.
short_description_max = 250

# Saved poster art: "<filename><poster_suffix>" (used by --download-only and embedding).
poster_suffix = ".poster.jpg"

# Database ids are written into the file and read back on later runs (preferred over the
# filename guess; flags/sidecar ids still win). Keys are metadata ids, values are tag names.
# MP4: iTunes freeform atoms "----:<id_domain>:<name>" (written with AtomicParsley --rDNSatom;
# exiftool can't write these, so with mp4_tool = "exiftool" ids are still written by AtomicParsley).
id_domain = "com.apple.iTunes"
[tagger.mp4_id_tags]
imdb_id = "IMDB_ID"
tmdb_id = "TMDB_ID"
thetvdb_id = "TVDB_ID"
tmdb_series_id = "TMDB_SERIES_ID"
tmdb_episode_id = "TMDB_EPISODE_ID"
thetvdb_series_id = "TVDB_SERIES_ID"
thetvdb_episode_id = "TVDB_EPISODE_ID"
# MKV: global simple tags, merged into the existing tags (others, incl. track tags, are kept).
[tagger.mkv_id_tags]
imdb_id = "IMDB"
tmdb_id = "TMDB"
thetvdb_id = "TVDB"
tmdb_series_id = "TMDB_SERIES"
tmdb_episode_id = "TMDB_EPISODE"
thetvdb_series_id = "TVDB_SERIES"
thetvdb_episode_id = "TVDB_EPISODE"

[providers]
# Providers to query, in order. (IMDb ids given with --imdb are resolved through TMDB.)
order = ["tmdb", "thetvdb"]

[providers.tmdb]
# Get one at https://www.themoviedb.org/settings/api. Set read_token (preferred) or api_key.
read_token = ""
api_key = ""
base_url = "https://api.themoviedb.org/3"
image_base = "https://image.tmdb.org/t/p"
# Poster size: w92 w154 w185 w342 w500 w780 original.
poster_size = "original"
# Landscape art sizes: backdrops w300 w780 w1280 original; episode stills w92 w185 w300 original.
backdrop_size = "original"
still_size = "original"
# Preferred backdrop language (backdrops with the title); falls back to textless (null).
image_language = "en"
language = "en-US"

[providers.thetvdb]
# Get one at https://thetvdb.com/api-information. pin only if your key is a user-supported key.
api_key = ""
pin = ""
base_url = "https://api4.thetvdb.com/v4"
# Poster size: "full" or "thumbnail".
poster_size = "full"
# Preferred background-art language; falls back to untagged.
image_language = "eng"

[merge]
# Composite metadata: for each field, take the first provider in its list that has a value.
default = ["tmdb", "thetvdb"]
[merge.fields]
episode_title = ["thetvdb", "tmdb"]
description = ["tmdb", "thetvdb"]
# Artwork source preference (first provider with art wins).
poster_url = ["tmdb", "thetvdb"]
season_poster_url = ["tmdb", "thetvdb"]
backdrop_url = ["tmdb", "thetvdb"]
still_url = ["tmdb", "thetvdb"]

[matching]
# Filename -> title. Applied to the file stem in order: separators become spaces,
# then TV patterns (named groups show/season/episode), then movie patterns (title/year).
separators = '[._]+'
tv_patterns = [
  '(?i)^(?P<show>.*?)[ \-]*S(?P<season>\d{1,2})[ \-]*E(?P<episode>\d{1,3})',
  '(?i)^(?P<show>.*?)[ \-]*(?P<season>\d{1,2})x(?P<episode>\d{2,3})\b',
]
movie_patterns = [
  '^(?P<title>.+)[ \-]*[(\[](?P<year>(?:19|20)\d{2})[)\]]',
  '^(?P<title>.+?)[ \-]*[(\[]?(?P<year>(?:19|20)\d{2})[)\]]?(?:\s|$)',
]
# Removed from titles (case-insensitive), e.g. release junk.
cleanup = [
  '(?i)\b(2160p|1080p|720p|480p|4k|uhd|hdr|bluray|blu-ray|brrip|web-?dl|webrip|hdtv|dvdrip|x264|x265|h\.?264|h\.?265|hevc|aac|ac3|dts|remux|proper|repack)\b.*$',
  '\[[^\]]*\]',
]
# If a TV filename has no show name, use the parent folder name.
show_from_parent_dir = true

[sort]
# Used only when an output root is set (--output or `output` above). Paths are relative to it.
# Placeholders: {title} {year} {show} {season} {episode} {episode_title} {ext}; {season:02} zero-pads.
movie_template = "Movies/{title} ({year})/{title} ({year}).{ext}"
tv_template = "TV/{show}/Season {season:02}/{show} - S{season:02}E{episode:02} - {episode_title}.{ext}"
# "move" or "copy".
mode = "move"
# Characters not allowed in file names, and what replaces them.
illegal_chars = '/\:*?"<>|'
replacement = "-"
