# Jack's profile: the source of truth for who Jack is and what Jack does.
# `jack --capabilities` prints this file. It is also stored (and embedded for meaning search)
# in media.db's windups table so Margaret and other windups can find Jack.
name = "jack"
role = "metadata"
summary = "Jack is the boss of all metadata. He reads a media file's own label first, looks it up in online databases, keeps everything he finds, and acts only on sure decisions."
purpose = "Know what every media file is, from the file's own facts and online sources, without ever guessing."
success_checks = [
  "every file processed gets exactly one entry handed to Daniel",
  "no guesses: an unsettled choice is stored as not_identified with all candidates and a reason",
  "only an id (from the file or a confirmed match) moves an entry to complete",
  "every source answer is kept as a candidate, never overwritten",
]
status = "active"
kinds = ["movie", "episode", "online_video"]
later_kinds = ["book", "document"]
sources = ["embedded", "tmdb", "thetvdb", "omdb", "tvmaze", "wikidata", "itunes", "youtube", "wikipedia", "yt-dlp info.json"]
reads = ["media files", "yt-dlp .info.json"]
writes = ["media.db (media, candidates, texts, art, ids, ratings, names, conflicts, unresolved, decisions, lifecycle stages and history, full search lists, works and their ids, last_checked; all via the Daniel handoff: Daniel stores, Larry hashes, Ruth builds the reference)", "file tags (fallback until Lauren)", "sorted folders (fallback until Sally)"]
never = ["guess between candidates", "overwrite a source's data", "tag from an unresolved decision", "replace the file's own facts without independent evidence", "silently drop an item", "merge entries on a fingerprint hint"]
hands_off = ["sammy: any step still ambiguous (parse, lookup, match, refine, conflict) via the Escalation trait; decisions recorded with provenance", "user: needs_flags items (--year, --imdb)"]
command = "jack [--capabilities] [--tmdb ID | --thetvdb ID | --imdb ID | --youtube ID | --x ID | --name NAME --year YEAR] PATH..."
