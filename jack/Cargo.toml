[package]
name = "jack"
version = "0.2.0"
edition = "2024"
description = "Tag and sort movie and TV files"
license = "MIT"
repository = "https://github.com/am517/windups"
homepage = "https://github.com/am517/windups"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
rpassword = "7"
walkdir = "2"
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
ureq = { version = "2", features = ["json"] }
unicode-normalization = "0.1.26"
windups.workspace = true
rusqlite = "0.32"
daniel.workspace = true

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
name = "windups-jack"
maintainer = "Adam Moore <am517@users.noreply.github.com>"
copyright = "2026, Adam Moore"
license-file = ["../LICENSE", "3"]
extended-description = "Jack, from the windups: reads a media file's own label, looks it up in online databases (TMDB, TheTVDB, OMDb), then tags and sorts movie and TV files."
section = "video"
priority = "optional"
depends = "libc6 (>= 2.31)"
recommends = "atomicparsley, libimage-exiftool-perl, mkvtoolnix"
# Debian's own `jack` package (a CD ripper) also installs /usr/bin/jack
conflicts = "jack"
assets = [
    ["target/release/jack", "usr/bin/", "755"],
    ["config/jack.toml", "usr/share/windups-jack/config.toml.example", "644"],
    ["README.md", "usr/share/doc/windups-jack/README.md", "644"],
]
